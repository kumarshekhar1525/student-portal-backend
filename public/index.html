<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Management Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0c10;
            --card-bg: rgba(22, 24, 34, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 17, 26, 0.8);
            --input-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .brand-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .header-stats {
            display: flex;
            gap: 15px;
        }

        .stat-badge {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-badge i {
            font-size: 18px;
            color: var(--primary);
        }

        .stat-info span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-info strong {
            font-size: 16px;
            font-weight: 700;
        }

        /* Main Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 28px;
        }

        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Glassmorphic Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 26px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: var(--primary);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            transition: color 0.3s;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea.form-control {
            padding-top: 12px;
            resize: vertical;
            min-height: 80px;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .form-control:focus + i {
            color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px var(--primary-glow);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Alert Toast */
        .alert-box {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .alert-box.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
        }

        .alert-box.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        /* Directory Controls */
        .directory-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
        }

        .btn-refresh {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 0 16px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-refresh:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Student Table / List */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(15, 17, 26, 0.9);
            padding: 14px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--card-border);
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .student-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .student-name {
            font-weight: 600;
            color: #ffffff;
        }

        .student-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .roll-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            color: var(--card-border);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header -->
        <header>
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div class="brand-text">
                    <h1>Student Portal</h1>
                    <p>Express & MongoDB Connected Backend</p>
                </div>
            </div>

            <div class="header-stats">
                <div class="stat-badge">
                    <i class="fa-solid fa-users"></i>
                    <div class="stat-info">
                        <span>Total Students</span>
                        <strong id="statCount">0</strong>
                    </div>
                </div>
                <div class="stat-badge">
                    <i class="fa-solid fa-server" style="color: var(--success);"></i>
                    <div class="stat-info">
                        <span>Server Status</span>
                        <strong style="color: var(--success);">Online</strong>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="dashboard-grid">
            <!-- Left Column: Registration Form -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fa-solid fa-user-plus"></i> New Student Registration
                    </h2>
                </div>

                <form id="studentForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
                            <i class="fa-regular fa-user"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fatherName">Father's Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="fatherName" class="form-control" placeholder="e.g. Suresh Sharma" required>
                            <i class="fa-solid fa-user-group"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="rollNo">Roll Number</label>
                        <div class="input-wrapper">
                            <input type="text" id="rollNo" class="form-control" placeholder="e.g. CS2026-001" required>
                            <i class="fa-solid fa-id-card"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phoneNo">Phone Number</label>
                        <div class="input-wrapper">
                            <input type="tel" id="phoneNo" class="form-control" placeholder="e.g. 9876543210" required>
                            <i class="fa-solid fa-phone"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <div class="input-wrapper">
                            <textarea id="address" class="form-control" placeholder="Enter residential address" required></textarea>
                            <i class="fa-solid fa-location-dot" style="top: 20px;"></i>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmit" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> Register Student
                    </button>
                </form>

                <div id="formAlert" class="alert-box"></div>
            </div>

            <!-- Right Column: Student Directory -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fa-solid fa-address-book"></i> Registered Student Directory
                    </h2>
                </div>

                <div class="directory-toolbar">
                    <div class="search-box">
                        <div class="input-wrapper">
                            <input type="text" id="searchInput" class="form-control" placeholder="Search by name, roll no, phone...">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                    </div>
                    <button id="btnRefresh" class="btn-refresh" title="Reload List">
                        <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> Refresh
                    </button>
                </div>

                <!-- Table -->
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Father's Name</th>
                                <th>Roll No</th>
                                <th>Contact</th>
                                <th>Address</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <tr>
                                <td colspan="6">
                                    <div class="empty-state">
                                        <div class="spinner" style="margin: 0 auto 10px;"></div>
                                        Loading student data...
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script>
        const studentForm = document.getElementById('studentForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const formAlert = document.getElementById('formAlert');
        const studentTableBody = document.getElementById('studentTableBody');
        const searchInput = document.getElementById('searchInput');
        const btnRefresh = document.getElementById('btnRefresh');
        const refreshIcon = document.getElementById('refreshIcon');
        const statCount = document.getElementById('statCount');

        let allStudents = [];

        // Helper to get initials
        function getInitials(name) {
            if (!name) return 'S';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return parts[0][0].toUpperCase();
        }

        // Display Alert Message
        function showAlert(message, type = 'success') {
            formAlert.className = `alert-box ${type}`;
            formAlert.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i> ${message}`;
            formAlert.style.display = 'flex';
            setTimeout(() => {
                formAlert.style.display = 'none';
            }, 5000);
        }

        // Fetch students from backend GET /api/users
        async function fetchStudents() {
            refreshIcon.classList.add('fa-spin');
            try {
                const res = await fetch('/api/users');
                const result = await res.json();

                if (result.success) {
                    allStudents = result.data || [];
                    statCount.innerText = result.count || allStudents.length;
                    renderStudents(allStudents);
                } else {
                    renderEmpty('Failed to load students');
                }
            } catch (err) {
                console.error('Fetch error:', err);
                renderEmpty('Unable to connect to backend API');
            } finally {
                setTimeout(() => refreshIcon.classList.remove('fa-spin'), 500);
            }
        }

        // Render Student List in Table
        function renderStudents(students) {
            if (!students || students.length === 0) {
                renderEmpty('No registered students found.');
                return;
            }

            studentTableBody.innerHTML = students.map(student => `
                <tr>
                    <td>
                        <div class="student-cell">
                            <div class="avatar">${getInitials(student.name)}</div>
                            <div>
                                <div class="student-name">${escapeHtml(student.name)}</div>
                                <div class="student-meta">${new Date(student.createdAt).toLocaleDateString()}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span style="font-weight: 500;">${escapeHtml(student.fatherName || '-')}</span>
                    </td>
                    <td>
                        <span class="roll-badge">${escapeHtml(student.rollNo)}</span>
                    </td>
                    <td>
                        <i class="fa-solid fa-phone" style="font-size: 11px; color: var(--text-muted);"></i> ${escapeHtml(student.phoneNo)}
                    </td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        ${escapeHtml(student.address)}
                    </td>
                    <td>
                        <button class="btn-delete" onclick="deleteStudent('${student._id}', '${escapeHtml(student.name)}')" title="Delete Student">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function renderEmpty(message) {
            studentTableBody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="fa-regular fa-folder-open"></i>
                            <p>${message}</p>
                        </div>
                    </td>
                </tr>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Handle Registration Form Submit (POST /api/users/register)
        studentForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                name: document.getElementById('name').value.trim(),
                fatherName: document.getElementById('fatherName').value.trim(),
                rollNo: document.getElementById('rollNo').value.trim(),
                phoneNo: document.getElementById('phoneNo').value.trim(),
                address: document.getElementById('address').value.trim()
            };

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<div class="spinner"></div> Registering...`;

            try {
                const res = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (result.success) {
                    showAlert(result.message || 'Student registered successfully!');
                    studentForm.reset();
                    fetchStudents();
                } else {
                    showAlert(result.message || 'Registration failed', 'error');
                }
            } catch (err) {
                showAlert('Network error: Server connection failed', 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Register Student`;
            }
        });

        // Delete Student Record (DELETE /api/users/:id)
        async function deleteStudent(id, name) {
            if (!confirm(`Are you sure you want to delete ${name}?`)) return;

            try {
                const res = await fetch(`/api/users/${id}`, {
                    method: 'DELETE'
                });
                const result = await res.json();

                if (result.success) {
                    showAlert(result.message || 'Student record deleted!');
                    fetchStudents();
                } else {
                    showAlert(result.message || 'Could not delete student', 'error');
                }
            } catch (err) {
                showAlert('Failed to contact server for deletion', 'error');
            }
        }

        // Search Filter Logic
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allStudents.filter(student => 
                (student.name && student.name.toLowerCase().includes(query)) ||
                (student.fatherName && student.fatherName.toLowerCase().includes(query)) ||
                (student.rollNo && student.rollNo.toLowerCase().includes(query)) ||
                (student.phoneNo && student.phoneNo.toLowerCase().includes(query)) ||
                (student.address && student.address.toLowerCase().includes(query))
            );
            renderStudents(filtered);
        });

        btnRefresh.addEventListener('click', fetchStudents);

        // Initial fetch on page load
        fetchStudents();
    </script>
</body>
</html>
